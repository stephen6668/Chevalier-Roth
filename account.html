<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account | Chevalier & Roth</title><link rel="stylesheet" href="assets/css/styles.css"><script src="assets/js/store.js"></script><script src="assets/js/app.js" defer></script></head><body><main class="page"><div class="eyebrow">CUSTOMER ACCOUNT</div><h1 class="page-title">My Account</h1><div class="notice">Demo account area for GitHub Pages. Use an external authentication service (such as Appwrite) for production login and secure personal data.</div><div id="orders"></div></main><script>document.addEventListener('DOMContentLoaded',()=>{const o=CR.orders();orders.innerHTML=o.length?o.map(x=>`<article style="background:white;border:1px solid var(--line);padding:20px;margin:12px 0"><h3>${x.number}</h3><p>${new Date(x.date).toLocaleString()} · ${CR.money(x.total)}</p><p>Status: ${x.status} · Payment: ${x.paymentStatus}</p></article>`).join(''):'No test orders yet.'})</script></body></html>
