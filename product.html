<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | Chevalier & Roth</title><link rel="stylesheet" href="assets/css/styles.css"><script src="assets/js/store.js"></script><script src="assets/js/app.js" defer></script></head><body><main class="page product-page"><section class="gallery" id="gallery"></section><section class="product-info"><div class="eyebrow" id="cat"></div><h1 id="name"></h1><div><span class="price" id="price"></span><span class="old" id="old"></span></div><p id="desc" style="line-height:1.8;color:#6d665f"></p><div class="options"><div class="eyebrow">SIZE</div><div class="chips" id="sizes"></div></div><div class="options"><div class="eyebrow">COLOUR</div><div class="chips" id="colors"></div></div><p id="stock"></p><button class="btn" style="width:100%" onclick="add()">ADD TO BAG</button><div class="notice" style="margin-top:18px">14-day return information, shipping information and final product details should be reviewed before launch.</div></section></main>
<script>
let p,size,color;
document.addEventListener('DOMContentLoaded',async()=>{const id=new URLSearchParams(location.search).get('id');p=(await CR.products()).find(x=>x.id===id)||(await CR.products())[0];name.textContent=p.name;cat.textContent=p.category;desc.textContent=p.description;price.textContent=CR.money(CR.effectivePrice(p));old.textContent=p.salePrice?CR.money(p.price):'';gallery.innerHTML=p.images.map(x=>`<img src="${x}" alt="${CR.sanitize(p.name)}">`).join('');sizes.innerHTML=p.sizes.map(x=>`<button class="chip" onclick="pick(this,'size','${x}')">${x}</button>`).join('');colors.innerHTML=p.colors.map(x=>`<button class="chip" onclick="pick(this,'color','${x}')">${x}</button>`).join('');stock.textContent=p.stock>0?`${p.stock} in stock`:'Sold out'});
function pick(el,t,v){el.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));el.classList.add('active');if(t==='size')size=v;else color=v}
function add(){if(!size||!color)return alert('Please select size and colour.');let c=CR.cart(),x=c.find(i=>i.id===p.id&&i.size===size&&i.color===color);if(x)x.qty++;else c.push({id:p.id,size,color,qty:1});CR.saveCart(c);alert('Added to bag.')}
</script></body></html>
