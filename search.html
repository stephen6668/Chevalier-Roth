<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search | Chevalier & Roth</title><link rel="stylesheet" href="assets/css/styles.css"><script src="assets/js/store.js"></script><script src="assets/js/app.js" defer></script></head><body><main class="page"><div class="eyebrow">SEARCH</div><h1 class="page-title">Find your piece.</h1><div class="field" style="max-width:600px;margin-bottom:30px"><input id="q" placeholder="Search products..." oninput="run()"></div><div class="grid" id="results"></div></main><script>async function run(){const q=document.getElementById('q').value.toLowerCase(),ps=(await CR.products()).filter(p=>p.active&&(`${p.name} ${p.category} ${p.description}`.toLowerCase().includes(q)));document.getElementById('results').innerHTML=ps.map(p=>`<article class="card"><a href="product.html?id=${p.id}" style="text-decoration:none"><div class="card-media"><img src="${p.images[0]}"></div><div class="card-body"><div class="card-title">${CR.sanitize(p.name)}</div><div class="meta"><span>${p.category}</span><span>${CR.money(CR.effectivePrice(p))}</span></div></div></a></article>`).join('')}document.addEventListener('DOMContentLoaded',run)</script></body></html>
