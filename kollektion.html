<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Chevalier & Roth Kollektion – Damen, Herren und Accessoires."><title>Kollektion – Chevalier & Roth</title><link rel="stylesheet" href="style.css"><script src="cr-store.js"></script><script src="shop.js" defer></script></head><body>
<div class="announce" data-announcement></div><header class="site-header"><nav class="nav-left"><a class="nav-link" href="index.html">HOME</a><a class="nav-link" href="kollektion.html">KOLLEKTION</a></nav><a class="brand" href="index.html"><img src="logo.PNG" alt="Chevalier & Roth"><span data-brand></span></a><nav class="nav-right"><a class="nav-link" href="profil.html">KONTO</a><a class="icon-btn" href="cart.html">BAG · <span data-cart-count>0</span></a></nav></header>
<main class="section"><div class="section-head"><div><div class="eyebrow">CHEVALIER & ROTH · COLLECTION 01</div><h1 class="section-title">Die Kollektion</h1></div><p class="section-sub">Moderne Klassiker in ruhigen Farben. Elegant genug für besondere Momente, tragbar genug für jeden Tag.</p></div>
<div class="collection-toolbar"><div class="filters" id="filters"><button class="filter active" data-cat="ALL">ALLE</button><button class="filter" data-cat="DAMEN">DAMEN</button><button class="filter" data-cat="HERREN">HERREN</button><button class="filter" data-cat="ACCESSOIRES">ACCESSOIRES</button></div><div class="collection-tools"><input id="search" class="search-input" placeholder="Produkt suchen"><select id="sort" class="select-input"><option value="default">SORTIERUNG</option><option value="price-asc">PREIS AUFSTEIGEND</option><option value="price-desc">PREIS ABSTEIGEND</option><option value="name">NAME A–Z</option></select></div></div>
<div class="product-grid" id="grid"></div><p id="empty" class="section-sub" style="display:none;margin-top:30px">Keine Produkte gefunden.</p></main>
<footer><div class="footer-in"><div>© 2026 CHEVALIER & ROTH · LUXEMBOURG</div><div class="footer-links"><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a><a href="agb.html">AGB</a><a href="wiederruf.html">Widerruf</a></div></div></footer>
<script>let cat='ALL';function draw(){let p=CR.getProducts().filter(x=>x.active!==false&&(cat==='ALL'||x.category===cat));const q=document.getElementById('search').value.trim().toLowerCase();if(q)p=p.filter(x=>(x.name+' '+x.category+' '+(x.description||'')).toLowerCase().includes(q));const s=document.getElementById('sort').value;if(s==='price-asc')p.sort((a,b)=>CR.productPrice(a)-CR.productPrice(b));if(s==='price-desc')p.sort((a,b)=>CR.productPrice(b)-CR.productPrice(a));if(s==='name')p.sort((a,b)=>a.name.localeCompare(b.name,'de'));Shop.renderGrid('#grid',p);document.getElementById('empty').style.display=p.length?'none':'block'}document.addEventListener('DOMContentLoaded',()=>{draw();document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');cat=b.dataset.cat;draw()});document.getElementById('search').addEventListener('input',draw);document.getElementById('sort').addEventListener('change',draw)});</script></body></html>
