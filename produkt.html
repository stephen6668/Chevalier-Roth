<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produkt – Chevalier & Roth</title><link rel="stylesheet" href="style.css"><script src="cr-store.js"></script><script src="shop.js" defer></script></head><body><div class="announce" data-announcement></div><header class="site-header"><nav class="nav-left"><a class="nav-link" href="index.html">HOME</a><a class="nav-link" href="kollektion.html">KOLLEKTION</a></nav><a class="brand" href="index.html"><img src="logo.PNG" alt="Chevalier & Roth"><span data-brand></span></a><nav class="nav-right"><a class="nav-link" href="profil.html">KONTO</a><a class="icon-btn" href="cart.html">BAG · <span data-cart-count>0</span></a></nav></header>
<main class="detail"><section class="gallery" id="gallery"></section><section><div class="eyebrow" id="cat"></div><h1 class="product-title" id="name"></h1><div class="price-row" style="margin-bottom:22px"><span class="price" id="price"></span><span class="old" id="old"></span><span class="sale" id="sale"></span></div><p class="desc" id="desc"></p><div class="product-meta"><div class="meta-item"><small>VERSAND</small><span>Luxemburg / EU</span></div><div class="meta-item"><small>RÜCKGABE</small><span>14 Tage</span></div><div class="meta-item"><small>STIL</small><span>Quiet Luxury</span></div></div><div class="eyebrow" style="margin-top:28px">GRÖSSE WÄHLEN</div><div class="sizes" id="sizes"></div><button class="cta" style="width:100%;margin-top:0" id="add">IN DEN WARENKORB</button><p class="section-sub" style="margin-top:24px">Sichere Zahlung · klare Rückgabeinformationen · elegantes Packaging</p></section></main><div class="toast"></div>
<script>let p,sel='';function load(){const id=new URLSearchParams(location.search).get('id')||'p1';p=CR.getProducts().find(x=>x.id===id)||CR.getProducts()[0];document.title=p.name+' – Chevalier & Roth';cat.textContent=p.category;name.textContent=p.name;price.textContent=CR.money(CR.productPrice(p));old.textContent=CR.productPrice(p)<p.price?CR.money(p.price):(p.compareAt>p.price?CR.money(p.compareAt):'');sale.textContent=CR.productPrice(p)<p.price?'−'+p.discount+'%':'';desc.textContent=p.description||'';gallery.innerHTML=(p.images||[]).map((src,i)=>`<div class="gimg"><div class="img-fallback">CR</div><img src="${CR.escape(src)}" alt="${CR.escape(p.name)} Foto ${i+1}" onerror="this.style.display='none'"></div>`).join('')||'<div class="gimg"><div class="img-fallback">CR</div></div>';sizes.innerHTML=(p.sizes||['ONE SIZE']).map(s=>`<button class="size">${CR.escape(s)}</button>`).join('');document.querySelectorAll('.size').forEach(b=>b.onclick=()=>{document.querySelectorAll('.size').forEach(x=>x.classList.remove('active'));b.classList.add('active');sel=b.textContent});add.onclick=()=>{if(!sel){Shop.toast('Bitte zuerst eine Größe wählen.');return}let c=CR.getCart();let ex=c.find(x=>x.id===p.id&&x.size===sel);if(ex)ex.qty++;else c.push({id:p.id,size:sel,qty:1});CR.saveCart(c);Shop.updateCartCount();Shop.toast('Zum Warenkorb hinzugefügt.')}}document.addEventListener('DOMContentLoaded',load);</script></body></html>
