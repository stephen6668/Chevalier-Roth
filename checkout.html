<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Chevalier & Roth</title><link rel="stylesheet" href="assets/css/styles.css"><script src="assets/js/store.js"></script><script src="assets/js/app.js" defer></script></head><body><main class="page"><div class="eyebrow">SECURE CHECKOUT</div><h1 class="page-title">Checkout</h1><div class="notice"><b>GitHub Pages limitation:</b> this checkout collects no payment data. Connect a payment provider through a secure server-side service before accepting real orders.</div><form class="form-grid" onsubmit="placeOrder(event)"><label class="field"><span>First name</span><input id="first" required></label><label class="field"><span>Last name</span><input id="last" required></label><label class="field full"><span>Email</span><input id="email" type="email" required></label><label class="field"><span>Phone (optional)</span><input id="phone"></label><label class="field"><span>Country</span><select id="country"><option>Luxembourg</option><option>Belgium</option><option>France</option><option>Germany</option></select></label><label class="field"><span>Street</span><input id="street" required></label><label class="field"><span>House number</span><input id="house" required></label><label class="field"><span>Postal code</span><input id="zip" required></label><label class="field"><span>City</span><input id="city" required></label><div class="field full"><button class="btn">CREATE TEST ORDER</button></div></form></main>
<script>
async function placeOrder(e){e.preventDefault();const ps=await CR.products(), cart=CR.cart();if(!cart.length)return alert('Your bag is empty.');const lines=cart.map(i=>({...i,product:ps.find(p=>p.id===i.id)})).filter(i=>i.product);const subtotal=lines.reduce((s,i)=>s+CR.effectivePrice(i.product)*i.qty,0),disc=CR.get('checkoutDiscount',null)?.discount||0,total=subtotal-disc;const order={number:'CR-'+Date.now(),date:new Date().toISOString(),customer:`${first.value} ${last.value}`,email:email.value,items:lines.map(i=>({name:i.product.name,qty:i.qty,size:i.size,color:i.color,unit:CR.effectivePrice(i.product)})),subtotal,discount:disc,shipping:0,tax:'included/placeholder',total,paymentStatus:'Pending',status:'New Order'};let o=CR.orders();o.push(order);CR.saveOrders(o);CR.saveCart([]);alert(`Test order ${order.number} created. No payment was taken.`);location.href='account.html'}
</script></body></html>
