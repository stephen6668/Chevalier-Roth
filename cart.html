<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopping Bag | Chevalier & Roth</title><link rel="stylesheet" href="assets/css/styles.css"><script src="assets/js/store.js"></script><script src="assets/js/app.js" defer></script></head><body><main class="page"><div class="eyebrow">YOUR BAG</div><h1 class="page-title">Shopping Bag</h1><div class="cart-layout"><div id="items"></div><aside class="summary"><h2>Summary</h2><div id="sumLines"></div><div class="field" style="margin:20px 0"><span>Discount code</span><input id="promo" placeholder="WELCOME10"></div><button class="btn outline" style="width:100%;margin-bottom:10px" onclick="renderCart()">APPLY CODE</button><a class="btn" style="width:100%" href="checkout.html">CHECKOUT</a></aside></div></main>
<script>
let ps=[],applied=null;
document.addEventListener('DOMContentLoaded',async()=>{ps=await CR.products();renderCart()});
function rows(){return CR.cart().map(i=>({...i,product:ps.find(p=>p.id===i.id)})).filter(i=>i.product)}
function setQty(n,q){let c=CR.cart();if(q<=0)c.splice(n,1);else c[n].qty=q;CR.saveCart(c);renderCart()}
function renderCart(){const r=rows();items.innerHTML=r.length?r.map((i,n)=>`<div class="cart-item"><img src="${i.product.images[0]}"><div><h3>${i.product.name}</h3><p>${i.size} · ${i.color}</p><p>${CR.money(CR.effectivePrice(i.product))}</p></div><div><button onclick="setQty(${n},${i.qty-1})">−</button> ${i.qty} <button onclick="setQty(${n},${i.qty+1})">+</button></div></div>`).join(''):'Your bag is empty.';const subtotal=r.reduce((s,i)=>s+CR.effectivePrice(i.product)*i.qty,0);const code=promo?.value||'';const v=code?CR.validateCode(code,subtotal,r):{ok:false,discount:0};applied=v.ok?v:null;const discount=applied?.discount||0;const total=subtotal-discount;sumLines.innerHTML=`<p>Subtotal <b style="float:right">${CR.money(subtotal)}</b></p><p>Discount <b style="float:right">−${CR.money(discount)}</b></p><hr><p>Total <b style="float:right">${CR.money(total)}</b></p>${code?`<small>${v.msg||''}</small>`:''}`;CR.set('checkoutDiscount',applied?{code:applied.code.code,discount}:null)}
</script></body></html>
