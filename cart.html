<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Warenkorb – Chevalier & Roth</title><link rel="stylesheet" href="style.css"><script src="cr-store.js"></script><script src="shop.js" defer></script></head><body><div class="announce" data-announcement></div><header class="site-header"><nav class="nav-left"><a class="nav-link" href="index.html">HOME</a><a class="nav-link" href="kollektion.html">WEITER EINKAUFEN</a></nav><a class="brand" href="index.html"><img src="logo.PNG"><span data-brand></span></a><nav class="nav-right"><span class="nav-link">BAG · <span data-cart-count>0</span></span></nav></header><main class="cart-layout"><section><div class="eyebrow">YOUR BAG</div><h1 class="section-title">Warenkorb</h1><div id="items"></div></section><aside class="summary"><div class="eyebrow">ZUSAMMENFASSUNG</div><div class="row"><input class="field" id="promo" placeholder="Aktionscode"><button class="cta" style="margin:0" id="apply">OK</button></div><p id="promoMsg" class="section-sub"></p><div class="sumline"><span>Zwischensumme</span><b id="subtotal"></b></div><div class="sumline"><span>Code-Rabatt</span><b id="discount">–</b></div><div class="sumline"><span>Versand</span><b id="shipping"></b></div><div class="sumline total"><span>Gesamt</span><b id="total"></b></div><button class="cta" style="width:100%">ZUR KASSE</button></aside></main><div class="toast"></div><script>let applied=null;function calc(){const products=CR.getProducts(),cart=CR.getCart();let sub=0,disc=0;cart.forEach(i=>{const p=products.find(x=>x.id===i.id);if(!p)return;const line=CR.productPrice(p)*i.qty;sub+=line;if(applied&&(applied.scope==='all'||applied.productIds.includes(p.id)))disc+=line*(applied.percent/100)});const ship=(sub-disc)>=120||sub===0?0:6.9;subtotal.textContent=CR.money(sub);discount.textContent=disc?'- '+CR.money(disc):'–';shipping.textContent=ship?CR.money(ship):'KOSTENLOS';total.textContent=CR.money(sub-disc+ship)}function draw(){const ps=CR.getProducts(),c=CR.getCart();items.innerHTML=c.length?c.map((i,k)=>{const p=ps.find(x=>x.id===i.id);if(!p)return'';return `<div class="cart-item"><img class="cart-thumb" src="${CR.escape(CR.imageSrc(p))}" onerror="this.style.opacity=.15"><div><div class="product-kicker">${CR.escape(p.category)}</div><div class="product-name">${CR.escape(p.name)}</div><div class="section-sub">Größe ${CR.escape(i.size)} · Menge ${i.qty}</div><button class="filter" onclick="removeItem(${k})">ENTFERNEN</button></div><b>${CR.money(CR.productPrice(p)*i.qty)}</b></div>`}).join(''):'<p class="section-sub">Dein Warenkorb ist leer.</p>';Shop.updateCartCount();calc()}window.removeItem=k=>{let c=CR.getCart();c.splice(k,1);CR.saveCart(c);draw()};document.addEventListener('DOMContentLoaded',()=>{draw();apply.onclick=()=>{const code=promo.value.trim().toUpperCase();applied=CR.getCodes().find(x=>x.active&&x.code.toUpperCase()===code)||null;promoMsg.textContent=applied?`${applied.percent}% Rabatt angewendet${applied.scope==='selected'?' – nur auf ausgewählte Produkte':''}.`:'Code nicht gültig.';calc()}});</script><script src="cr-nav.js"></script>
</body></html>
